# PR checks for the static site. The job is named `validate` so the
# existing required status check on main keeps reporting.
#
# Every check step runs even after an earlier one fails
# (`if: ${{ !cancelled() }}`), and the last step names every failure.
# scripts/check-ci-run-through.mjs fails the build if a check step loses
# that condition.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # npm 10 (Node 22 on the runner) crashes resolving html-validate's
      # optional vitest/jest peers ("reading 'edgesOut'"); skip peer resolution.
      - name: HTML validation
        id: html
        if: ${{ !cancelled() }}
        env:
          npm_config_legacy_peer_deps: 'true'
        run: npx --yes html-validate@11.6.2 "**/*.html"

      # Checks same-site links only. External URLs are skipped, and so is
      # /cdn-cgi/, which only the Cloudflare edge serves.
      - name: Local links resolve
        id: links
        if: ${{ !cancelled() }}
        run: npx --yes linkinator@8.0.3 . --recurse --skip '^https?://(?!(localhost|127\.0\.0\.1)[:/])' --skip '/cdn-cgi/'

      - name: No localhost references
        id: localhost
        if: ${{ !cancelled() }}
        run: |
          if grep -rEn 'http://localhost|127\.0\.0\.1' --include=*.html --include=*.css --include=*.js --exclude-dir=node_modules .; then
            echo "::error::localhost reference found"
            exit 1
          fi

      - name: CI steps keep the run-through condition
        id: runthrough
        if: ${{ !cancelled() }}
        run: node scripts/check-ci-run-through.mjs .github/workflows/ci.yml

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          HTML: ${{ steps.html.outcome }}
          LINKS: ${{ steps.links.outcome }}
          LOCALHOST: ${{ steps.localhost.outcome }}
          RUNTHROUGH: ${{ steps.runthrough.outcome }}
        run: |
          failed=""
          for pair in "html-validate:$HTML" "links:$LINKS" "localhost:$LOCALHOST" "run-through:$RUNTHROUGH"; do
            echo "${pair%%:*}: ${pair#*:}" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "${pair#*:}" = "success" ] || failed="$failed ${pair%%:*}"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed checks:$failed"
            exit 1
          fi
