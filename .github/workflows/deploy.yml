# Deploys main to the Cloudflare Pages project `boostpipeline-com`
# (boostpipeline.com) on every push to main, or by hand from main.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages edit) and
# CLOUDFLARE_ACCOUNT_ID. style.css and fonts/ are committed build output, so
# there is no build step; only the files the site serves are uploaded, and a
# new top-level asset must be added to "Stage site files".

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # A dispatch from another branch must not overwrite production.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Stage site files
        run: |
          mkdir dist
          cp ./*.html robots.txt sitemap.xml _headers style.css dist/
          cp -R fonts dist/
          find dist -type f | sort

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=boostpipeline-com --branch=main
