# Deploys the static site to the Cloudflare Pages project `boostpipeline-com`
# (custom domains boostpipeline.com and www) on every push to main.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages edit) and
# CLOUDFLARE_ACCOUNT_ID. Only the files the site serves are uploaded; a new
# top-level asset must be added to the list in "Stage site files".
#
# workflow_dispatch with branch=<name> makes a preview deploy at
# https://<name>.boostpipeline-com.pages.dev to diff before promoting.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Pages branch to deploy (main = production)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.branch || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::repo secrets not set:$missing"
            exit 1
          fi

      - name: Stage site files
        run: |
          mkdir dist
          for f in *.html robots.txt sitemap.xml _headers _redirects style.css; do
            if [ -e "$f" ]; then cp "$f" dist/; fi
          done
          if [ -d fonts ]; then cp -R fonts dist/; fi
          test -f dist/index.html
          find dist -type f | sort

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.inputs.branch || 'main' }}
        run: npx --yes wrangler@4.153.0 pages deploy dist --project-name=boostpipeline-com --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
